apiVersion: v1
kind: Secret
metadata:
  name: openmind-secrets
  namespace: openmind
type: Opaque
data:
  # These should be base64 encoded values
  # migration-encryption-key: <base64-encoded-key>
  # wallet-address: <base64-encoded-address>
  # solana-rpc-url: <base64-encoded-url>
  # aniday-api-key: <base64-encoded-key>
  # dify-api-key: <base64-encoded-key>
  # n8n-api-key: <base64-encoded-key>
  # n8n-webhook-url: <base64-encoded-url>
  # digitalocean-access-token: <base64-encoded-token>
  # linode-access-token: <base64-encoded-token>
  # vultr-access-token: <base64-encoded-token>
  # aws-access-key-id: <base64-encoded-key>
  # aws-secret-access-key: <base64-encoded-key>
  # cloudflare-token: <base64-encoded-token>
  # vercel-token: <base64-encoded-token>
  # master-encryption-key: <base64-encoded-key>
  # backup-encryption-key: <base64-encoded-key>