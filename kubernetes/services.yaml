apiVersion: v1
kind: Service
metadata:
  name: openmind
  namespace: openmind
  labels:
    app: openmind-ai
spec:
  selector:
    app: openmind-ai
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ipfs
  namespace: openmind
  labels:
    app: ipfs
spec:
  selector:
    app: ipfs
  ports:
  - name: swarm
    port: 4001
    targetPort: 4001
    protocol: TCP
  - name: api
    port: 5001
    targetPort: 5001
    protocol: TCP
  - name: gateway
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: fuel-system
  namespace: openmind
  labels:
    app: fuel-system
spec:
  selector:
    app: fuel-system
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: migration-coordinator
  namespace: openmind
  labels:
    app: migration-coordinator
spec:
  selector:
    app: migration-coordinator
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP