<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#faceGradient)"/>

  <!-- Matrix code rain effect -->
  <g opacity="0.3">
    <!-- Left side code -->
    <text x="20" y="30" font-family="monospace" font-size="8" fill="#00ff00">01010101</text>
    <text x="20" y="45" font-family="monospace" font-size="8" fill="#00ff00">10101010</text>
    <text x="20" y="60" font-family="monospace" font-size="8" fill="#00ff00">01010101</text>
    <text x="20" y="75" font-family="monospace" font-size="8" fill="#00ff00">11110000</text>

    <!-- Right side code -->
    <text x="160" y="40" font-family="monospace" font-size="8" fill="#00ff00">01010101</text>
    <text x="160" y="55" font-family="monospace" font-size="8" fill="#00ff00">10101010</text>
    <text x="160" y="70" font-family="monospace" font-size="8" fill="#00ff00">01010101</text>
  </g>

  <!-- Face silhouette -->
  <ellipse cx="100" cy="110" rx="45" ry="55" fill="#2a2a4a" opacity="0.8"/>
  <ellipse cx="100" cy="95" rx="40" ry="45" fill="#1e1e3f" opacity="0.9"/>

  <!-- Eyes -->
  <!-- Left eye (blue) -->
  <circle cx="88" cy="90" r="6" fill="#0066ff"/>
  <circle cx="88" cy="90" r="3" fill="#00ccff"/>
  <circle cx="88" cy="90" r="8" fill="none" stroke="#00ccff" stroke-width="1" opacity="0.7"/>

  <!-- Right eye (yellow) -->
  <circle cx="112" cy="90" r="6" fill="#ffaa00"/>
  <circle cx="112" cy="90" r="3" fill="#ffff00"/>
  <circle cx="112" cy="90" r="8" fill="none" stroke="#ffff00" stroke-width="1" opacity="0.7"/>

  <!-- Eye glow effects -->
  <circle cx="88" cy="90" r="12" fill="none" stroke="#00ccff" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <circle cx="112" cy="90" r="12" fill="none" stroke="#ffff00" stroke-width="2" opacity="0.3" filter="url(#glow)"/>

  <!-- Mouth -->
  <path d="M 85 115 Q 100 125 115 115" stroke="#666666" stroke-width="2" fill="none"/>

  <!-- Cyberpunk details -->
  <rect x="75" y="75" width="50" height="2" fill="#00ccff" opacity="0.6"/>
  <rect x="75" y="105" width="50" height="1" fill="#00ccff" opacity="0.6"/>

  <!-- Title text -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#00ccff" font-weight="bold">
    NEON CYBERPUNK ORACLE
  </text>
</svg>