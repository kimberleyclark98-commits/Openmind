  <!-- Central face silhouette (subtle) -->
  <g opacity="0.3">
    <ellipse cx="400" cy="300" rx="120" ry="150" fill="#001100"/>
    <ellipse cx="400" cy="270" rx="100" ry="120" fill="#002200"/>
    <!-- Eyes -->
    <circle cx="370" cy="250" r="8" fill="#00ff00"/>
    <circle cx="430" cy="250" r="8" fill="#00ff00"/>
    <!-- Mouth -->
    <path d="M 370 320 Q 400 340 430 320" stroke="#00ff00" stroke-width="2" fill="none"/>
  </g>

  <!-- Animated falling effect hint -->
  <animateTransform
    attributeName="transform"
    attributeType="XML"
    type="translate"
    values="0,0;0,10;0,0"
    dur="3s"
    repeatCount="indefinite"
  />
</svg>